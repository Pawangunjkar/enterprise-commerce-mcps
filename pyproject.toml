[project]
name = "enterprise-commerce-mcps"
version = "1.0.0"
description = "Python MCP servers for every Enterprise Commerce Suite application"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.2.0",
  "httpx>=0.27.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
ecs-mcp-api-gateway = "ecs_mcps.api_gateway:main"
ecs-mcp-search-solr-indexer = "ecs_mcps.search_solr_indexer:main"
